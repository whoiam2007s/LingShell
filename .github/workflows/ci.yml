name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 界面文案检查
        run: pnpm i18n:check

      - name: 结构与 IPC 协议检查
        run: pnpm check:structure

      - name: 构建
        run: pnpm build

  test:
    name: 单元 / 集成测试
    runs-on: ubuntu-latest
    # packages/dsh-controller 的 e2e 曾在 beforeAll 撞 vitest 默认 10s hookTimeout；
    # 已在 packages/dsh-controller/vitest.config.ts 放宽到 60s，测试恢复为阻塞项。
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 测试
        # *.real.test.ts 依赖真实环境（Git Bash / SSH / Docker / 宿主机时序），
        # 在 CI 跑会假失败；需要时在真机上用 pnpm test 全量跑。
        run: pnpm test:ci

  package-linux:
    name: Linux 打包验证
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Linux 产物一直没被真正构建过（release.yml 只出 Windows），这里先跑通再谈发布。
    # 只验证「能不能打出 AppImage」，不发布，产物作为 artifact 留档。
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包 AppImage
        # 自动更新地址写进 app-update.yml，与正式发布一致；--publish never 确保不上传。
        # 必须开 pipefail：默认 shell 不带它，`| tee` 会把 electron-builder 的失败吞成 0。
        shell: bash
        env:
          LINGSHELL_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          set -o pipefail
          pnpm dist:linux 2>&1 | tee build-linux.log

      - name: 检查产物
        shell: bash
        run: |
          ls -lh release/ || true
          echo '--- 全仓 AppImage 搜索 ---'
          find . -name '*.AppImage' 2>/dev/null | head -5
          test -n "$(find release -name '*.AppImage' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

      - name: 失败时把诊断信息推到 ci-logs 分支
        # 仓库令牌读不到 Actions 日志，把关键信息推到独立分支便于排查（调试用，稳定后删）。
        # 推新分支而不是 PR 分支：PR 事件下 HEAD 是合并提交，推回原分支必然 non-fast-forward。
        if: failure()
        shell: bash
        run: |
          {
            echo '=== build-linux.log 尾部 ==='
            tail -c 18000 build-linux.log 2>/dev/null || echo '(没有 build-linux.log)'
            echo
            echo '=== release 目录 ==='
            ls -lh release/ 2>/dev/null || echo '(没有 release 目录)'
            echo
            echo '=== 全仓 AppImage ==='
            find . -name '*.AppImage' 2>/dev/null | head -5 || true
          } > ci-linux-failure.log
          git checkout -B ci-logs
          git add -f ci-linux-failure.log
          git -c user.name=lingshell-ci -c user.email=ci@lingshell.local commit -m "ci: Linux 打包失败诊断"
          git push -f origin ci-logs
