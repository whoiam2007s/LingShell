name: CI

on:
  push:
    # 任意分支推送都跑：feature 分支推上来就能看到 check / test 结果，不用再手动 dispatch。
    # 打包 job 另有 if 限制，只在 master / PR 上跑，避免 feature 分支浪费 Actions 分钟。
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 界面文案检查
        run: pnpm i18n:check

      - name: 结构与 IPC 协议检查
        run: pnpm check:structure

      - name: 构建
        run: pnpm build

  test:
    name: 单元 / 集成测试
    runs-on: ubuntu-latest
    # packages/dsh-controller 的 e2e 曾在 beforeAll 撞 vitest 默认 10s hookTimeout；
    # 已在 packages/dsh-controller/vitest.config.ts 放宽到 60s，测试恢复为阻塞项。
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 测试
        # *.real.test.ts 依赖真实环境（Git Bash / SSH / Docker / 宿主机时序），
        # 在 CI 跑会假失败；需要时在真机上用 pnpm test 全量跑。
        run: pnpm test:ci

  package-linux:
    name: Linux 打包验证
    runs-on: ubuntu-latest
    # 打包要 10+ 分钟：只在 master 推送、PR、手动触发时跑；feature 分支推送只跑 check + test
    if: github.event_name != 'push' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    # Linux 产物此前从未真正构建过（release.yml 只出 Windows）。这里只验证「能不能打出
    # AppImage」并留档 artifact，不发布；真正发布在 release.yml 里接。
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包 AppImage
        # 自动更新地址写进 app-update.yml，与正式发布一致；--publish never 确保不上传。
        # 必须开 pipefail：默认 shell 不带它，`| tee` 会把 electron-builder 的失败吞成 0。
        shell: bash
        env:
          LINGSHELL_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          set -o pipefail
          pnpm dist:linux 2>&1 | tee build-linux.log

      - name: 检查产物
        shell: bash
        run: |
          ls -lh release/
          test -n "$(find release -name '*.AppImage' -print -quit)"

      - name: 启动冒烟（xvfb 真启动打包产物）
        # 类型检查 / 单测 / 打包都绿，也挡不住"启动后白屏"。这里在虚拟显示里真跑一次打包产物：
        # 主进程的 LINGSHELL_SMOKE 分支会检查 #root 里是否真有渲染内容，再用退出码报告
        # （见 apps/desktop/src/main/app/smoke.ts）。
        shell: bash
        env:
          LINGSHELL_SMOKE: '1'
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgbm1 libnss3 libatk-bridge2.0-0 libgtk-3-0 libxss1 libxtst6 libasound2t64 2>/dev/null \
            || sudo apt-get install -y -qq xvfb libgbm1 libnss3 libatk-bridge2.0-0 libgtk-3-0 libxss1 libxtst6 libasound2
          APP="$(find release/linux-unpacked -maxdepth 1 -type f -perm -u+x -name 'lingshell*' -print -quit)"
          echo "打包产物可执行文件: ${APP:-（没找到）}"
          test -n "$APP"
          timeout 120 xvfb-run -a "$APP" --no-sandbox 2>&1 | tee smoke.log
          grep -q 'SMOKE_OK' smoke.log

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
  package-macos:
    name: macOS 打包验证
    runs-on: macos-latest
    # macOS 只在「首个 mac 版本」和「系统兼容性调整」时需要验证（产品决定）。
    # 因此不阻塞 PR：PR 时跳过，只在 master 推送 / 手动触发时跑 —— 否则每次 PR 都会被
    # macOS runner 排队拖住（实测连续三次排队后被取消）。需要时用 workflow_dispatch 手动跑。
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    # macOS 产物从未被真正构建过（README 一直标"未在 macOS 上验证"）。这里只验证
    # 能不能打出 DMG 并留档 artifact，不发布、不签名（identity: null，见
    # apps/desktop/electron-builder.config.cjs）。
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包 DMG（未签名）
        # 与 Windows / Linux 一致地把更新地址写进 app-update.yml。
        # 必须开 pipefail：默认 shell 不带它，`| tee` 会把失败吞成 0。
        shell: bash
        env:
          LINGSHELL_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          pnpm dist:mac 2>&1 | tee build-macos.log

      - name: 检查产物
        shell: bash
        run: |
          ls -lh release/
          test -n "$(find release -name '*.dmg' -print -quit)"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/latest-mac.yml
          if-no-files-found: error
          # 保留 30 天：macOS 不进正式 Release（未签名 + 自动更新不可用），只作为实验版供试用的入口
          retention-days: 30

