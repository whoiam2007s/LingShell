name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并打包
        env:
          # electron-updater 的 generic provider：指向本仓库最新 Release 的资产目录，
          # 客户端会去取 <url>/latest.yml。不想启用自动更新就删掉这一行（产出的包不带 app-update.yml）。
          LINGSHELL_UPDATE_URL: https://github.com/whoiam2007s/LingShell/releases/latest/download
          # 代码签名：有证书时在这里接上，二选一
          #   - 传统 pfx：CSC_LINK / CSC_KEY_PASSWORD（私钥在硬件 token 或云 HSM 时用不了，需自定义 win.sign）
          #   - Azure Trusted Signing：在 apps/desktop/electron-builder.config.cjs 里加 win.azureSignOptions，
          #     凭据用 AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
          #   注意：一旦开始签名就要一直签（客户端校验 publisherName），中途停签会导致更新失败。
        run: pnpm dist:win

      - name: 生成 SBOM
        run: node scripts/sbom.mjs release/sbom.json

      - name: 从 CHANGELOG 提取本版说明
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^##\s*\[" + [regex]::Escape($ver) + "\].*?(?=^##\s|\z)")
          $body = if ($m.Success) { $m.Value.Trim() } else { "版本 $ver" }
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if ($exe) {
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            $body += "`n`n### 安装包校验`n`n``$($exe.Name)```n`nSHA256: ``$hash```n"
          }
          $body += "`n> 安装包当前未签名，Windows 首次运行会提示 SmartScreen。"
          $body | Out-File -FilePath release-notes.md -Encoding utf8

      - name: 上传到 Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/sbom.json

  linux:
    name: Linux 安装包（AppImage）
    # 跑在 Windows 作业之后：由它先创建好 Release，这里只追加资产，
    # 不传 body/body_path，避免把已经生成的发布说明覆盖掉。
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并打包
        env:
          # 与 Windows 相同：产出 latest-linux.yml，客户端据此自动更新
          LINGSHELL_UPDATE_URL: https://github.com/whoiam2007s/LingShell/releases/latest/download
        run: pnpm dist:linux

      - name: 追加 AppImage 到同一个 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.AppImage
            release/latest-linux.yml
          fail_on_unmatched_files: true
