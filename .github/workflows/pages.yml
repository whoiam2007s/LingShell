name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'guide/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 推 gh-pages 分支只需要写内容权限；用 checkout 自带的凭据推，不依赖第三方 action
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: 发布文档站
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 组装站点并推到 gh-pages
        # guide/ 里的 Markdown 与截图直接当站点内容；site/ 提供 docsify 外壳与侧栏。
        # docsify 在浏览器里渲染 Markdown，没有构建步骤：文档改了推上去就是新的。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r guide/. _site/
          cp site/index.html site/index.md site/_sidebar.md _site/

          git config user.name "lingshell-bot"
          git config user.email "bot@lingshell.local"

          # 用孤立分支承载站点内容，避免把仓库历史带进发布产物
          git checkout --orphan gh-pages-new
          git rm -rq --cached . || true
          find . -maxdepth 1 -mindepth 1 ! -name '_site' ! -name '.git' -exec rm -rf {} +
          cp -r _site/. .
          rm -rf _site
          git add -A
          git commit -q -m "docs: 发布文档站"
          git branch -M gh-pages
          git push -f origin gh-pages
