version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 分支落后于 master 时自动 rebase，否则 PR 上的 CI 会一直用旧的工作流配置
    rebase-strategy: auto
    groups:
      # react / react-dom / @types/react* 必须同版本：只升其中一个会让 React 与 ReactDOM
      # 版本错配，前端测试（renderToStaticMarkup 断言）会整片失败 —— PR #6 就是这么挂的。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
    # @deepseek-ai/dsh-* 通过根 package.json 的 pnpm.overrides 锁在同一个 rc 版本，
    # 大范围自动升级会打乱版本对齐，交给人工评估。
    ignore:
      # @types/node 要跟着 .nvmrc / Electron 的运行时走：大版本跳跃（如 22 → 26）会带来
      # Buffer 等类型变更（string | NonSharedBuffer），代码要成片改，交给人工评估。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Electron 大版本升级要跨多个版本改 API（clipboard.readBuffer 被移除、printToPDF 的
      # marginType 也不存在了），还要重验三平台打包与自动更新 —— 见 issue #20，人工做。
      # electron-vite 是 electron 的构建链，两者大版本要一起升才安全（#29 就是这种情况）。
      - dependency-name: "electron-vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 是 CSS 优先的重写，样式必须人工逐个界面核对，CI 测不出来 —— 见 issue #20。
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 的原生编译器把 JS API 移到 unstable 入口，typescript-eslint 与
      # scripts/check-tdz.mjs 都用不了 —— 见 issue #19，等生态支持。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@deepseek-ai/*"
      # koffi 的子包（@koromix/koffi-<平台>）必须与 koffi 主包版本一致，
      # 单独升某个平台包会让打包后的原生依赖对不上；要升就整体人工升。
      - dependency-name: "@koromix/koffi-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
