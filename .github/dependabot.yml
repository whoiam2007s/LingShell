version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # @deepseek-ai/dsh-* 通过根 package.json 的 pnpm.overrides 锁在同一个 rc 版本，
    # 大范围自动升级会打乱版本对齐，交给人工评估。
    ignore:
      - dependency-name: "@deepseek-ai/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
