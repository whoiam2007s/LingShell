name: Bug 报告
description: 功能不正常、崩溃、界面错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认：安全漏洞不要发公开 issue，请按 [SECURITY.md](https://github.com/whoiam2007s/LingShell/blob/master/SECURITY.md) 私下报告。
        粘贴日志 / 截图前请删除 API Key、密码、私钥、真实主机名和客户数据。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置 → 关于里的版本号，以及是安装版还是 `pnpm dev`
      placeholder: 例如 0.1.0 安装版 / dev
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: 例如 Windows 11 26100 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. ... 2. ... 3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错请贴原文；界面问题请附截图
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 诊断包
      description: 设置 → 备份与诊断 → 导出诊断包；或 ~/.lingshell/logs 下最新 main.log / web.log 的相关片段
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已删除日志 / 截图中的密钥、密码、私钥和真实主机信息
          required: true
        - label: 这不是安全漏洞（安全漏洞走私密渠道）
          required: true
