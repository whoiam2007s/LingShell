<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>灵壳 手机查看</title>
<style>
:root{--color-bg:#f5f6f8;--color-panel:#fff;--color-text:#1d2129;--color-muted:#6b7280;--color-border:#e3e5ea;--color-accent:#2563eb;--color-on-accent:#fff;--color-danger:#dc2626;--color-on-danger:#fff;--color-warn:#b45309;--color-ok:#15803d;--color-user:#e8effd}
@media (prefers-color-scheme:dark){:root{--color-bg:#0f1115;--color-panel:#181b21;--color-text:#e6e8eb;--color-muted:#9aa1ac;--color-border:#2a2f38;--color-accent:#5b9bff;--color-on-accent:#0f1115;--color-danger:#f26b6b;--color-on-danger:#0f1115;--color-warn:#e5a54b;--color-ok:#4ec27a;--color-user:#1d2a40}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--color-bg);color:var(--color-text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--color-panel);border-bottom:1px solid var(--color-border)}
header h1{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
button{font:inherit;border-radius:10px;border:1px solid var(--color-border);background:var(--color-panel);color:var(--color-text);padding:9px 14px;cursor:pointer}
button:disabled{opacity:.5}
.back{padding:6px 10px}
.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent);font-weight:600}
.danger{background:var(--color-danger);border-color:var(--color-danger);color:var(--color-on-danger);font-weight:600}
.card{background:var(--color-panel);border:1px solid var(--color-border);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--color-muted);font-size:13px}
.badge{display:inline-block;flex-shrink:0;border-radius:999px;padding:1px 8px;font-size:12px;border:1px solid currentColor}
.s-running{color:var(--color-accent)}.s-waiting{color:var(--color-warn)}.s-done{color:var(--color-muted)}
.prod{color:var(--color-danger)}
.dangerous{color:var(--color-danger)}
.center{text-align:center;padding:48px 16px}
.center h2{font-size:18px;margin:0 0 8px}
input{font:inherit;font-size:24px;letter-spacing:6px;text-align:center;width:100%;max-width:240px;padding:10px;border-radius:10px;border:1px solid var(--color-border);background:var(--color-panel);color:var(--color-text);margin:12px 0}
pre{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--color-bg);border:1px solid var(--color-border);font:13px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.err{color:var(--color-danger);font-size:14px;min-height:20px}
.msg{margin:8px 0;padding:9px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--color-user);margin-left:15%}
.msg.ai{background:var(--color-panel);border:1px solid var(--color-border);margin-right:6%}
.msg.tool{font-size:13px;color:var(--color-muted);padding:4px 11px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.msg.tool.failed{color:var(--color-danger)}
.auth{border-color:var(--color-warn);border-width:2px}
.auth .acts{display:flex;gap:8px;margin-top:10px}
.auth .acts button{flex:1}
.kv{font-size:13px;margin-top:4px}
.kv b{font-weight:600}
.note{margin-top:8px;font-size:13px;color:var(--color-warn)}
a{color:var(--color-accent)}
</style>
</head>
<body>
<header><button class="back" id="back" hidden>‹ 返回</button><h1 id="hd">灵壳</h1><span class="muted" id="st"></span></header>
<main id="main"></main>
<script>
(function () {
  'use strict'
  var main = document.getElementById('main'), hd = document.getElementById('hd'), st = document.getElementById('st'), back = document.getElementById('back')
  var timer = 0, view = '', deferred = {}
  // 界面语言跟手机：系统语言不是中文就用英文。服务端返回的报错 / 说明文字跟电脑上的界面语言
  var EN = !/^zh\b/i.test(navigator.language || '') ? {
    '灵壳 手机查看': 'LingShell Mobile', '‹ 返回': '‹ Back', '灵壳': 'LingShell',
    '进行中': 'Running', '等待授权': 'Awaiting approval', '完成': 'Done',
    '刚刚': 'just now', '{n} 分钟前': '{n} min ago', '{n} 小时前': '{n} h ago', '错误 {n}': 'Error {n}',
    '应用已锁定': 'App is locked', '请在电脑上解锁后再查看。': 'Unlock it on the computer, then check again.',
    '配对手机': 'Pair phone', '输入配对码': 'Enter pairing code',
    '在电脑上打开「设置 → 手机访问」，点「生成配对码」，输入显示的 6 位数字。': 'On the computer, open Settings → Mobile access, click "Generate pairing code", and enter the 6 digits shown.',
    '配对': 'Pair', '只在可信的局域网（家里 / 公司内网）使用，公共 Wi-Fi 不要开启。': 'Use only on a trusted LAN (home / office network). Do not turn it on over public Wi-Fi.',
    'AI 会话': 'AI sessions', '还没有会话': 'No sessions yet', '在电脑上和 AI 对话后会显示在这里。': 'Sessions appear here after you chat with the AI on the computer.',
    '未命名会话': 'Untitled session', '连接失败': 'Connection failed',
    '这是危险命令，确定允许执行？': 'This is a dangerous command. Allow it to run?',
    '计划审批：{title}': 'Plan approval: {title}', '生产': 'Production', '危险': 'Dangerous',
    '主机：{v}': 'Host: {v}', '原因：{v}': 'Reason: {v}', '说明：{v}': 'Explanation: {v}', '按规则：{v}': 'Rule: {v}', '回滚：{v}': 'Rollback: {v}',
    'AI 未提供回滚方案': 'The AI did not provide a rollback plan',
    '剩 {m} 分 {s} 秒，超时自动拒绝': '{m} min {s} s left; denied automatically on timeout',
    '允许': 'Allow', '拒绝': 'Deny', '去电脑上处理': 'Handle on computer', '会话': 'Session',
    '本次启动后还没有这个会话的对话记录。在电脑上打开该会话后，这里就能看到。': 'No messages for this session since the app started. Open the session on the computer and they will show here.',
    '手机上只能查看与授权；发消息、执行命令请在电脑上操作。': 'On the phone you can only view and approve. Send messages and run commands on the computer.',
    '加载失败': 'Load failed'
  } : null
  function T(s, p) { var r = (EN && EN[s]) || s; if (p) for (var k in p) r = r.split('{' + k + '}').join(String(p[k])); return r }
  if (EN) { document.documentElement.lang = 'en'; document.title = T('灵壳 手机查看'); back.textContent = T('‹ 返回'); hd.textContent = T('灵壳') }
  var STATUS = { running: T('进行中'), waiting: T('等待授权'), done: T('完成') }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
  function clear() { while (main.firstChild) main.removeChild(main.firstChild) }
  function ago(ms) {
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000))
    if (s < 60) return T('刚刚')
    if (s < 3600) return T('{n} 分钟前', { n: Math.floor(s / 60) })
    if (s < 86400) return T('{n} 小时前', { n: Math.floor(s / 3600) })
    var d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate()
  }
  function api(path, body) {
    var opt = body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin' }
    return fetch(path, opt).then(function (r) {
      return r.json().catch(function () { return {} }).then(function (j) {
        if (r.status === 401 && path !== '/api/pair') { showPair(); throw 'handled' }
        if (r.status === 423) { showLocked(); throw 'handled' }
        if (!r.ok) throw (j.message || j.error || T('错误 {n}', { n: r.status }))
        return j
      })
    })
  }
  function stop() { clearTimeout(timer); timer = 0 }
  function poll(fn) { stop(); timer = setTimeout(fn, 3000) }
  function center(title, text) { clear(); var c = el('div', 'center'); c.appendChild(el('h2', '', title)); if (text) c.appendChild(el('div', 'muted', text)); main.appendChild(c); return c }

  function showLocked() {
    stop(); view = 'locked'; back.hidden = true; hd.textContent = T('灵壳'); st.textContent = ''
    center(T('应用已锁定'), T('请在电脑上解锁后再查看。'))
    timer = setTimeout(route, 5000)
  }

  function showPair() {
    stop(); view = 'pair'; back.hidden = true; hd.textContent = T('配对手机'); st.textContent = ''
    var c = center(T('输入配对码'), T('在电脑上打开「设置 → 手机访问」，点「生成配对码」，输入显示的 6 位数字。'))
    var inp = el('input'); inp.inputMode = 'numeric'; inp.maxLength = 6; inp.autocomplete = 'one-time-code'; inp.placeholder = '000000'
    var m = /[#&]c=(\d{6})/.exec(location.hash); if (m) inp.value = m[1]
    var err = el('div', 'err'), btn = el('button', 'primary', T('配对'))
    btn.onclick = function () {
      btn.disabled = true; err.textContent = ''
      api('/api/pair', { code: inp.value }).then(function () { history.replaceState(null, '', '/'); route() })
        .catch(function (e) { if (e !== 'handled') err.textContent = String(e) }).then(function () { btn.disabled = false })
    }
    c.appendChild(el('div')).appendChild(inp); c.appendChild(err); c.appendChild(btn)
    c.appendChild(el('p', 'muted', T('只在可信的局域网（家里 / 公司内网）使用，公共 Wi-Fi 不要开启。')))
    if (m) btn.click()   // 扫码 / 带码链接打开：直接配对，失败再手动重试
    else inp.focus()
  }

  function showList() {
    view = 'list'; back.hidden = true; hd.textContent = T('AI 会话')
    api('/api/sessions').then(function (j) {
      if (view !== 'list') return
      clear(); st.textContent = ''
      if (!j.sessions.length) center(T('还没有会话'), T('在电脑上和 AI 对话后会显示在这里。'))
      j.sessions.forEach(function (s) {
        var c = el('div', 'card'), r = el('div', 'row')
        r.appendChild(el('div', 'grow title', s.title || T('未命名会话')))
        r.appendChild(el('span', 'badge s-' + s.status, s.status === 'waiting' && s.pending > 1 ? STATUS[s.status] + ' ' + s.pending : STATUS[s.status]))
        c.appendChild(r); c.appendChild(el('div', 'muted', ago(s.updatedAt)))
        c.onclick = function () { location.hash = 's=' + encodeURIComponent(s.id) }
        main.appendChild(c)
      })
      poll(showList)
    }).catch(function (e) { if (e !== 'handled') { center(T('连接失败'), String(e)); poll(showList) } })
  }

  function decide(a, decision, btns) {
    if (decision === 'allow' && a.risk === 'dangerous' && !confirm(T('这是危险命令，确定允许执行？') + '\n\n' + (a.command || ''))) return
    btns.forEach(function (b) { b.disabled = true })
    api('/api/decide', { approvalId: a.approvalId, decision: decision }).then(function () { showSession(sid()) })
      .catch(function (e) { if (e !== 'handled') { alert(String(e)); showSession(sid()) } })
  }

  function authCard(a) {
    var c = el('div', 'card auth'), r = el('div', 'row')
    r.appendChild(el('div', 'grow title', a.kind === 'plan' ? T('计划审批：{title}', { title: a.title || '' }) : T('等待授权')))
    if (a.prod) r.appendChild(el('span', 'badge prod', T('生产')))
    if (a.risk === 'dangerous') r.appendChild(el('span', 'badge dangerous', T('危险')))
    c.appendChild(r)
    if (a.host) c.appendChild(el('div', 'kv', T('主机：{v}', { v: a.host })))
    if (a.reason) c.appendChild(el('div', 'kv', T('原因：{v}', { v: a.reason })))
    if (a.explain) c.appendChild(el('div', 'kv', T('说明：{v}', { v: a.explain })))
    if (a.rule) c.appendChild(el('div', 'kv', T('按规则：{v}', { v: a.rule })))
    if (a.command) c.appendChild(el('pre', '', a.command))
    if (a.rollback) c.appendChild(el('div', 'kv', T('回滚：{v}', { v: a.rollback })))
    if (a.rollbackMissing) c.appendChild(el('div', 'note', T('AI 未提供回滚方案')))
    ;(a.steps || []).forEach(function (s, i) { c.appendChild(el('pre', s.dangerous ? 'dangerous' : '', (i + 1) + '. [' + s.host + '] ' + s.command)) })
    var left = Math.max(0, Math.round((a.deadline - Date.now()) / 1000))
    c.appendChild(el('div', 'muted', T('剩 {m} 分 {s} 秒，超时自动拒绝', { m: Math.floor(left / 60), s: left % 60 })))
    if (a.block) c.appendChild(el('div', 'note', a.block))
    var acts = el('div', 'acts'), btns = []
    if (a.canAllow) { var ok = el('button', 'primary', T('允许')); ok.onclick = function () { decide(a, 'allow', btns) }; btns.push(ok) }
    var no = el('button', 'danger', T('拒绝')); no.onclick = function () { decide(a, 'deny', btns) }; btns.push(no)
    if (!a.canAllow) { var pc = el('button', '', T('去电脑上处理')); pc.onclick = function () { deferred[a.approvalId] = 1; c.remove() }; btns.push(pc) }
    btns.forEach(function (b) { acts.appendChild(b) })
    c.appendChild(acts)
    return c
  }

  function sid() { var m = /[#&]s=([^&]+)/.exec(location.hash); return m ? decodeURIComponent(m[1]) : '' }

  function showSession(id) {
    view = 's:' + id; back.hidden = false
    api('/api/session?id=' + encodeURIComponent(id)).then(function (j) {
      if (view !== 's:' + id) return
      var stick = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40
      clear(); hd.textContent = j.title || T('会话')
      st.textContent = STATUS[j.status]; st.className = 's-' + j.status
      j.approvals.forEach(function (a) { if (!deferred[a.approvalId]) main.appendChild(authCard(a)) })
      if (!j.items.length) main.appendChild(el('div', 'center muted', T('本次启动后还没有这个会话的对话记录。在电脑上打开该会话后，这里就能看到。')))
      j.items.forEach(function (it) { main.appendChild(el('div', 'msg ' + it.role + (it.status === 'failed' ? ' failed' : ''), it.text)) })
      main.appendChild(el('p', 'muted', T('手机上只能查看与授权；发消息、执行命令请在电脑上操作。')))
      if (stick) window.scrollTo(0, document.body.scrollHeight)
      poll(function () { showSession(id) })
    }).catch(function (e) { if (e !== 'handled') { center(T('加载失败'), String(e)); poll(function () { showSession(id) }) } })
  }

  function route() {
    stop(); st.textContent = ''; st.className = 'muted'
    if (/[#&]c=\d{6}/.test(location.hash)) return api('/api/me').then(function () { history.replaceState(null, '', '/'); route() }).catch(function () {})
    var id = sid()
    api('/api/me').then(function () { if (id) showSession(id); else showList() }).catch(function (e) { if (e !== 'handled') center(T('连接失败'), String(e)) })
  }
  back.onclick = function () { location.hash = '' }
  window.addEventListener('hashchange', route)
  document.addEventListener('visibilitychange', function () { if (!document.hidden && (view === 'list' || view.indexOf('s:') === 0)) route() })
  route()
})()
</script>
</body>
</html>
