<!doctype html><html><head><meta charset="utf-8"><title>灵壳 LingShell</title>
<!-- 首帧前按缓存的外观设置先定主题（data-theme / data-kind / 底色）与图标大小，避免闪色（之后由 src/lib/appearance.ts 按已存设置校正；键名同 LOOK_CACHE_KEY）。
     B = 各主题底色、L = 浅色类主题，与 packages/shared/src/ui/appearance.ts 的 UI_THEMES 一致（单测校验） -->
<script>try{var B={dark:'#0d1117',light:'#ffffff',midnight:'#1a1b26',dracula:'#282a36',nord:'#2e3440',solarized:'#002b36',sepia:'#fdf6e3',contrast:'#000000',rose:'#191724',lavender:'#ffffff'},L={light:1,sepia:1,lavender:1},a=JSON.parse(localStorage.getItem('lingshell.appearance')||'{}'),t=a.uiTheme,s=matchMedia('(prefers-color-scheme: dark)').matches,d=document.documentElement;if(t==='system'){t=s?a.uiThemeDark:a.uiThemeLight;if(!B[t]||!L[t]!==s)t=s?'dark':'light'}if(!B[t])t='dark';d.dataset.theme=t;d.dataset.kind=L[t]?'light':'dark';d.style.background=B[t];d.style.setProperty('--icon-zoom',a.iconSize==='large'?'1.3':a.iconSize==='medium'?'1.15':'1')}catch(e){}</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
